name: MONOLITH Bridge PHP lint
on:
  push:
    branches:
      - feature/monolith-bridge-read-write
    paths:
      - 'plugin/monolith-bridge/**'
      - '.github/workflows/monolith-bridge-lint.yml'
  pull_request:
    paths:
      - 'plugin/monolith-bridge/**'
      - '.github/workflows/monolith-bridge-lint.yml'
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check MONOLITH Bridge PHP
        run: find plugin/monolith-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package installable WordPress plugin
        run: (cd plugin && zip -qr ../monolith-bridge-v0.3.0.zip monolith-bridge)
      - name: Publish installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MONOLITH-Bridge-v0.3.0
          path: monolith-bridge-v0.3.0.zip
